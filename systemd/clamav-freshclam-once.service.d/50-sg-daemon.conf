# Stained Glass OS: freshclam runs as a daemon (clamav-freshclam.service,
# which SG Defender wants). The package's daily one-shot is for machines
# without it: run beside the daemon, the two race for freshclam.log's lock
# at boot and the daemon exits ("Failed to lock the log file", qa4
# 2026-10-22), leaving the definitions to go stale. So it runs after the
# daemon and only when the daemon is not running.
[Unit]
After=clamav-freshclam.service

[Service]
ExecCondition=/bin/sh -c '! systemctl is-active -q clamav-freshclam.service'
