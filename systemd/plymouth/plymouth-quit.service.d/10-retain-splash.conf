# The splash hands the screen to the login screen (or Setup): Plymouth quits
# keeping its last frame, so the diamond stays until the compositor draws.
# greetd waits for this (Debian's unit is After=plymouth-quit-wait.service),
# so the quit itself must happen here, not in greetd -- quitting from greetd's
# ExecStartPre deadlocks the boot with the splash up forever.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
