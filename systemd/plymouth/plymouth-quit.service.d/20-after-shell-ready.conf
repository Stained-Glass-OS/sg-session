# The splash stays until the login screen can come: greetd waits for the
# machine's Wine prefix and server (sg-prefix-init takes most of a minute on a
# first boot), and Plymouth quit long before -- the screen was black for that
# minute. Ordering only: a machine without these units quits as before.
[Unit]
After=sg-prefix-init.service sg-wineserver.service sg-live.service
