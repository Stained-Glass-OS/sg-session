# Stained Glass OS: SG Defender's ClamAV is background work. Its first boot
# downloads the definitions (~200 MB) and loads them (~1 GB): at the lowest
# priority, so the first-run setup and the person's session go first (an
# install test's first-run setup came up late beside it, 2026-10-03).
[Service]
Nice=15
CPUWeight=20
IOSchedulingClass=idle
