# Stained Glass OS: clamd without the concurrent reload of its definitions,
# which held twice their memory (about 2 GB) each time freshclam brought new
# ones; Debian's clamd.conf stays as it is (lib/sg-clamd-conf).
[Service]
ExecStartPre=/usr/lib/stained-glass/sg-clamd-conf
ExecStart=
ExecStart=/usr/sbin/clamd --foreground=true --config-file=/var/lib/clamav/sg-clamd.conf
