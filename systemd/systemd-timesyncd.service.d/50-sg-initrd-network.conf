# Stained Glass: the clock is set from the network on every machine.
#
# The initrd runs systemd-networkd, which leaves /run/systemd/netif/state
# ("OPER_STATE=off") behind; NetworkManager, not networkd, runs the network
# afterwards, so the file is never updated and timesyncd, reading it, waits
# for a network that never comes: the clock was never set. A PC whose clock
# was hours behind (a Windows-installed one keeps local time in the RTC)
# then found every apt signature "not live until" later -- apt update failed
# with signing errors (Latitude 3520, David 2026-10-02). The stale file goes
# before timesyncd starts, unless networkd itself runs.
[Service]
ExecStartPre=+-/bin/sh -c 'systemctl -q is-active systemd-networkd.service || rm -f /run/systemd/netif/state'
