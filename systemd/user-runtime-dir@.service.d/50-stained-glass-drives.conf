# A user's network drive letters (sg-netmountd, sg-domain-logon) go with
# their last session, as a Windows logon session's mappings do -- however it
# ended, including loginctl terminate-user, which leaves no PAM close to run.
# So do the connections they made with a name and password (sg-netmountd
# LOGON: net use /user:, "Enter network credentials"): those stayed mounted
# after sign-out, and the next sign-in used them without the password.
# Drives remembered with "Reconnect at sign-in" come back at the next sign-in
# (the shell; with the credentials saved for their server).
[Service]
ExecStop=-/bin/rm -rf /run/stained-glass-net/drives/%i
ExecStop=-/bin/bash -c 'findmnt -rn -t cifs -o TARGET | while read -r m; do m=$$(printf "%%b" "$$m"); case "$$m" in /run/stained-glass-net/users/%i/*) umount -l "$$m" ;; esac; done; rm -rf /run/stained-glass-net/users/%i'
