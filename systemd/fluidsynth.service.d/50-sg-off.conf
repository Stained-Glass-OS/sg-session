# Stained Glass OS: Debian's fluidsynth package turns on a synthesizer
# daemon for every person (a user unit in default.target) when a program
# merely needs fluidsynth installed (Frescobaldi, 2026-10-22). It runs a
# command shell on TCP port 9800 on every network (-s) and the firewall
# asked about it at each sign-in. Programs that play MIDI load the library
# themselves; an administrator who wants the daemon creates this file.
[Unit]
ConditionPathExists=/etc/stained-glass/fluidsynth-daemon
