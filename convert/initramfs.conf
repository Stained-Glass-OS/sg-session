# Stained Glass OS: the initrd that converts the system drive (sg-snapshot
# convert-schedule runs mkinitramfs -d with a copy of this directory and adds
# MODULES=most, or MODULES=dep where the boot partition is short of room).
# Only that one initrd has sg-convert-root; every other initrd is Debian's own.
BUSYBOX=n
KEYMAP=n
COMPRESS=zstd
DEVICE=
NFSROOT=auto
RUNSIZE=10%
FSTYPE=auto
