# Stained Glass OS: the login screen and the desktop are Wayland compositors
# (wlroots), which find no GPU unless NVIDIA's driver does kernel modesetting;
# it leaves it off by default. fbdev=1: the console on the same framebuffer.
# Harmless without the NVIDIA driver (the option is for its module only).
options nvidia-drm modeset=1 fbdev=1
