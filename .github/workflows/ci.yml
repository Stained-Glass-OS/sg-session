name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run at a time per branch; a newer push waits, and replaces any run still
# waiting behind it. Not cancel-in-progress: that killed a run 20 minutes into
# its ~35-minute wine-sg build, before the build could be cached, so the next run
# had to redo all of it. Letting the running one finish caches Wine for every
# run after it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: lint + session gate
    runs-on: ubuntu-latest
    # Runs in Debian trixie, not on the Ubuntu runner directly, because that is
    # what this package actually ships to -- sg-image builds a trixie image.
    #
    # It is not merely tidiness. Ubuntu's Wine and Debian's differ in ways that
    # reach this gate: Ubuntu titles the virtual desktop window "Wine desktop"
    # where Debian says "Wine Desktop", and on Ubuntu's build the desktop window
    # never appeared on the X display at all. Testing the distribution we target
    # keeps the gate measuring our code instead of that difference.
    container:
      image: debian:trixie
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          # libwine, not wine/wine64: it brings the shared libraries Wine's Unix
          # side needs without putting a stock `wine` on PATH that the gate
          # could silently fall back to.
          apt-get install -y --no-install-recommends \
            make shellcheck cage xwayland x11-utils procps \
            libwine libsane1 ca-certificates adduser \
            debhelper build-essential devscripts
          # Everything debian/control says the build needs (mingw for the
          # Windows-side greeter and probes, PAM headers for the native
          # helpers). Read from the package rather than listed here, so the
          # two cannot drift apart again -- they did, and CI went red.
          apt-get build-dep -y ./

      # The gate must run on the Wine the image ships: wine-sg, under
      # /opt/wine-sg. Stock Debian Wine lacks the patches the session now relies
      # on (seeded user hives, user-writable display config, session 0), and
      # against it the taskbar comes up 1024 wide in a 1280 desktop -- a failure
      # of the Wine under test, not of this repo. wine-sg is built here rather
      # than downloaded, and the installed tree is cached on exactly what
      # determines it, so the ~35-minute build only reruns when wine-sg's
      # version, patch series or build script changes.
      - name: Check out wine-sg
        uses: actions/checkout@v4
        with:
          repository: Stained-Glass-OS/wine-sg
          path: _deps/wine-sg

      # Restore and save are separate steps so the build is cached as soon as
      # it succeeds. actions/cache's combined form saves only when the whole job
      # passes, so a failing gate threw away a 35-minute build every time.
      - name: Restore wine-sg
        id: wine-sg-cache
        uses: actions/cache/restore@v4
        with:
          path: /opt/wine-sg
          key: wine-sg-opt-${{ runner.os }}-${{ hashFiles('_deps/wine-sg/wine-version', '_deps/wine-sg/patches/**', '_deps/wine-sg/build.sh') }}

      - name: Build wine-sg (cache miss only)
        if: steps.wine-sg-cache.outputs.cache-hit != 'true'
        run: |
          apt-get install -y --no-install-recommends \
            curl xz-utils patch file mingw-w64-tools
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get build-dep -y --no-install-recommends wine
          apt-get install -y --no-install-recommends libsane-dev
          make -C _deps/wine-sg install

      - name: Save wine-sg
        if: steps.wine-sg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/wine-sg
          key: ${{ steps.wine-sg-cache.outputs.cache-primary-key }}

      - name: Confirm the gate will use wine-sg
        run: |
          test -x /opt/wine-sg/bin/wine || { echo "wine-sg missing from /opt/wine-sg"; exit 1; }
          /opt/wine-sg/bin/wine --version

      - name: Lint
        run: make lint

      - name: Session gate
        # Wine is unhappy run as root, and the gate is meant to look like a real
        # session, so run it as an ordinary user with its own runtime dir.
        run: |
          adduser --disabled-password --gecos '' ci
          chown -R ci:ci .
          install -d -o ci -g ci -m 700 /tmp/xdg
          runuser -u ci -- env XDG_RUNTIME_DIR=/tmp/xdg HOME=/home/ci make test-session

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: session-logs
          path: test/tmp/log/
          if-no-files-found: ignore

  package:
    name: build .deb
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            make debhelper build-essential devscripts shellcheck ca-certificates
          apt-get build-dep -y ./

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect package
        run: mkdir -p dist && cp ../sg-session_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: sg-session-deb
          path: dist/*.deb
