# The audit spool (sg-audit, sg-brokerd -> the Windows Security log, wine-sg
# 0187): only root and the SYSTEM account may write it, so no user can put an
# event in the Security log; the Event Log service (SYSTEM) reads and empties it.
d /var/lib/stained-glass-audit 0700 sgsystem sgwine -
# Device Manager's disabled devices (sg-sysinfo --apply-disabled at boot).
d /var/lib/stained-glass-sysinfo 0755 root root -
