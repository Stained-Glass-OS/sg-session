# Stained Glass session state.
#
# Created at boot rather than at package install: an image build runs in an
# unprivileged user namespace where chowning to sguser's uid is not permitted.
# MULTIUSER-DEBT: D11 -- all of this is owned by one user.

# Group-owned by sgwine, setgid, so that adding a user to that group is enough
# to admit them to the shared system prefix -- and so anything created inside
# keeps the group rather than the creator's primary one.
# Owned by the SYSTEM account, group-writable by sgwine. Ownership is not
# bookkeeping: wine-sg maps the prefix's owner to the SYSTEM SID and treats it
# as the machine's administrator, so this line is what makes sgsystem SYSTEM.
# Sticky (2026-10-07): the group writes its own files there, no one renames
# or deletes another's (sg-common.sh's sg_shared_state_hardened says why).
d /var/lib/stained-glass        3770 sgsystem sgwine -
d /var/lib/stained-glass/prefix 3770 sgsystem sgwine -
d /var/lib/stained-glass/state  3770 sgsystem sgwine -
# Machine logs only (the SYSTEM account writes; users may read, as they may
# read Windows' Application log). Per-user output goes to the journal, which
# keeps each user's to themselves (debt D11).
d /var/log/stained-glass        2750 sgsystem sgwine -
d /run/stained-glass-seat 0755 root root -
d /run/stained-glass-seat/seat0 1770 root sgwine -
# Remote Desktop's unprivileged account needs a home: FreeRDP makes each
# connection's settings under it.
d /var/lib/sg-rdp 0700 sgrdp sgrdp -
# The lock-screen pictures users publish from Settings (sg-settingsctl
# lockscreen) for the lock screen, which the machine account draws. 1733:
# anyone may create a file here, no one may list the directory or replace
# another's file; sg-lockd trusts only a file owned by the session's user.
d /var/lib/stained-glass/lockscreen 1733 sgsystem sgwine -
# the login screen's memory: the last account signed in (sg-greet-bridge)
d /var/lib/sg-greeter 0750 sggreet sggreet -
# The session user's ~/.local/share (its home is /var/lib/stained-glass):
# gnome-keyring makes the login keyring in .local/share/keyrings. A .local
# left owned by root by the image build made that fail ("unable to create
# keyring dir", the keyring never opened: CI's boot-test, 2026-10-07); d
# sets the owner and mode of one that exists too.
d /var/lib/stained-glass/.local       3770 sgsystem sgwine -
d /var/lib/stained-glass/.local/share 3770 sgsystem sgwine -
# Administrators read the system journal, as members of adm and wheel do
# (systemd's own systemd.conf): sg-admins was in neither, so an
# administrator's journalctl showed only their own session (David,
# 2026-10-07). Recursive for the persistent journal: files archived before
# this became readable too.
a+ /run/log/journal    - - - - d:group:sg-admins:r-x,group:sg-admins:r-x
A+ /run/log/journal/%m - - - - d:group:sg-admins:r-x,group:sg-admins:r-X
a+ /var/log/journal    - - - - d:group:sg-admins:r-x,group:sg-admins:r-x
A+ /var/log/journal/%m - - - - d:group:sg-admins:r-x,group:sg-admins:r-X
