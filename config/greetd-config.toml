# greetd: the Windows-style login screen (ADR 0008).
#
# greetd runs sg-login-ui as `sggreet`; the greeter collects a user name and
# password, greetd authenticates them with PAM, and only then starts
# /usr/bin/sg-session-start as that user. There is no autologin: the Phase 0
# placeholder that logged `sguser` in unattended is gone (multiuser debt D2).

[terminal]
vt = 1

[default_session]
command = "/usr/lib/stained-glass/sg-login-ui"
user = "sggreet"
