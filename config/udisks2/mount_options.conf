# Stained Glass OS: removable media are the machine's, as on Windows -- a FAT
# or exFAT stick has no owners there and every user may write to it. udisks
# mounts them for sgsystem (sg-automount@.service); umask 0000 lets every
# account write. CDs and DVDs are read-only in any case.
[defaults]
vfat_defaults=uid=$UID,gid=$GID,shortname=mixed,utf8=1,showexec,flush,umask=0000
exfat_defaults=uid=$UID,gid=$GID,iocharset=utf8,errors=remount-ro,umask=0000
