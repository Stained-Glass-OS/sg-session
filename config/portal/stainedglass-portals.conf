# Stained Glass OS (XDG_CURRENT_DESKTOP=StainedGlass, sg-session-start): the
# portal's backends. GTK's for everything it offers -- above all Settings,
# which tells GTK 4, Qt 6 and browsers the user's light or dark mode and
# accent (sg-settingsctl look sets them). Screen sharing and screenshots are
# the compositor's, through wlroots' backend: any program may capture the
# screen, the lock and consent screens are blanked (sg-compositor).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
