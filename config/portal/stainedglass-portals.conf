# Stained Glass OS (XDG_CURRENT_DESKTOP=StainedGlass:sway, sg-session-start): the
# portal's backends. GTK's for everything it offers -- above all Settings,
# which tells GTK 4, Qt 6 and browsers the user's light or dark mode and
# accent (sg-settingsctl look sets them). Screenshots are the compositor's,
# through wlroots' backend; screen sharing and remote control are ours
# (xdg-desktop-portal-sg, a fork of it): any program may capture the screen,
# the lock and consent screens blanked (sg-compositor); the keyboard and
# pointer only once the person allowed it on the secure surface.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=sg
org.freedesktop.impl.portal.RemoteDesktop=sg
org.freedesktop.impl.portal.Screenshot=wlr
