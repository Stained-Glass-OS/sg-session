# Stained Glass OS: every account may ping, as on Windows. Windows programs'
# ping (ping.exe, PowerShell's Test-Connection, .NET's Ping) go through
# IcmpSendEcho, which Wine sends on an unprivileged ICMP socket; Debian leaves
# those off ("1 0"), and every ping failed with "General failure". This is
# systemd's own default.
net.ipv4.ping_group_range = 0 2147483647
