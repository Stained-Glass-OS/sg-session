# Stained Glass OS: the OpenSSH server is on, and people sign in with their
# account's password (David 2026-10-01: ssh to a machine without setting up
# keys first). root signs in with keys only. sshd takes the first value it
# reads, so this file (05-) decides over later ones; an administrator who
# wants keys only sets PasswordAuthentication and KbdInteractiveAuthentication
# to no here, or stops the server: systemctl disable --now ssh.
PermitRootLogin prohibit-password
PasswordAuthentication yes
KbdInteractiveAuthentication yes
UseDNS no
